name: Exelia starter integrity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Shell syntax
        run: bash -n install.sh scripts/*.sh
      - name: Starter structural audit
        run: python3 scripts/validate-starter.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Offline fresh-install simulation
        run: python3 tests/integration_smoke.py
      - name: Public repository hygiene
        run: python3 scripts/check-publication.py
      - name: Git whitespace audit
        run: git diff --check HEAD~1 HEAD || test "$(git rev-list --count HEAD)" -eq 1
# Review upstream changes and update immutable references explicitly.
