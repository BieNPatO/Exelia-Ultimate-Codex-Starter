# Optional development-only service profiles. No service starts implicitly.
services:
  postgres:
    image: postgres:17-alpine
    profiles: ["db"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_dev}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-51025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-58025}:8025"
  minio:
    image: minio/minio:latest
    profiles: ["object"]
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-devminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev_password_change_me}
    ports:
      - "127.0.0.1:${MINIO_PORT:-59000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - object_dev_data:/data
volumes:
  pg_dev_data:
  object_dev_data:
